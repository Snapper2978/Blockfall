<script>
/* Browser host for blockfall.wasm: canvas drawing, keyboard / gamepad / touch input,
 * localStorage "files", the text prompt, and the WebSocket carrying the relay stream. */
(() => {
  'use strict';
  const KEY = { A: 1, B: 2, X: 4, Y: 8, L: 16, R: 32, START: 64, SELECT: 128, UP: 256, DOWN: 512, LEFT: 1024, RIGHT: 2048, TOUCH: 4096 };
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const go = document.getElementById('go');
  const splash = document.getElementById('splash');
  const errEl = document.getElementById('err');
  let wasm = null, mem = null;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const u8 = () => new Uint8Array(mem.buffer);
  const cstr = (p) => { const m = u8(); let e = p; while (m[e]) e++; return dec.decode(m.subarray(p, e)); };
  const putBytes = (p, bytes, max) => { const n = Math.min(bytes.length, max); u8().set(bytes.subarray(0, n), p); return n; };

  /* ---------- drawing ---------- */
  const colorCache = new Map();
  function css(c) {
    let s = colorCache.get(c);
    if (s === undefined) {
      const r = c & 255, g = (c >>> 8) & 255, b = (c >>> 16) & 255, a = (c >>> 24) & 255;
      s = a === 255 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${(a / 255).toFixed(3)})`;
      if (colorCache.size > 512) colorCache.clear();
      colorCache.set(c, s);
    }
    return s;
  }
  let clipped = false;

  /* ---------- input ---------- */
  const keys = new Set();
  const latched = new Set();            /* keys pressed since the last frame: a quick tap still counts for one frame */
  const touchBits = { U: 0, D: 0, L: 0, R: 0, A: 0, B: 0, X: 0, S: 0, T: 0 };
  let pointerDown = false;
  const BLOCK = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Backspace', 'Enter']);
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) return;
    if (BLOCK.has(e.code) || /^Key[A-Z]$/.test(e.code)) e.preventDefault();
    keys.add(e.code); latched.add(e.code);
  });
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); latched.clear(); pointerDown = false; for (const k in touchBits) touchBits[k] = 0; });
  const has = (...c) => c.some((k) => keys.has(k) || latched.has(k));
  function keyboardBits() {
    let h = 0;
    if (has('ArrowUp', 'KeyW')) h |= KEY.UP;
    if (has('ArrowDown', 'KeyS')) h |= KEY.DOWN;
    if (has('ArrowLeft', 'KeyA')) h |= KEY.LEFT;
    if (has('ArrowRight', 'KeyD')) h |= KEY.RIGHT;
    if (has('KeyZ', 'Space')) h |= KEY.A;
    if (has('KeyX', 'KeyK')) h |= KEY.B;
    if (has('KeyC', 'KeyJ')) h |= KEY.X;
    if (has('KeyV', 'KeyL')) h |= KEY.Y;
    if (has('KeyQ')) h |= KEY.L;
    if (has('KeyE')) h |= KEY.R;
    if (has('Enter', 'NumpadEnter')) h |= KEY.START;
    if (has('Backspace', 'Tab')) h |= KEY.SELECT;
    return h;
  }
  function touchBitsMask() {
    let h = 0;
    if (touchBits.U) h |= KEY.UP; if (touchBits.D) h |= KEY.DOWN;
    if (touchBits.L) h |= KEY.LEFT; if (touchBits.R) h |= KEY.RIGHT;
    if (touchBits.A) h |= KEY.A; if (touchBits.B) h |= KEY.B; if (touchBits.X) h |= KEY.X;
    if (touchBits.S) h |= KEY.START; if (touchBits.T) h |= KEY.SELECT;
    return h;
  }
  let pads = [];
  const padBits = [], padAx = [];
  function readPads() {
    const list = (navigator.getGamepads ? Array.from(navigator.getGamepads()) : []).filter((g) => g && g.connected);
    pads = list.slice(0, 8);
    pads.forEach((g, i) => {
      const b = (n) => g.buttons[n] && (g.buttons[n].pressed || g.buttons[n].value > 0.5);
      let h = 0;
      if (b(0)) h |= KEY.A; if (b(1)) h |= KEY.B; if (b(2)) h |= KEY.X; if (b(3)) h |= KEY.Y;
      if (b(4) || b(6)) h |= KEY.L; if (b(5) || b(7)) h |= KEY.R;
      if (b(8)) h |= KEY.SELECT; if (b(9)) h |= KEY.START;
      if (b(12)) h |= KEY.UP; if (b(13)) h |= KEY.DOWN; if (b(14)) h |= KEY.LEFT; if (b(15)) h |= KEY.RIGHT;
      padBits[i] = h;
      const dz = (v) => (Math.abs(v) < 0.15 ? 0 : v);
      padAx[i] = [Math.round(dz(g.axes[0] || 0) * 156), Math.round(-dz(g.axes[1] || 0) * 156)];
    });
  }

  /* ---------- relay connection (WebSocket) ---------- */
  let ws = null, wsQueue = [], wsQueued = 0, wsClosed = false, wsPending = [];
  function wsOpen(host, port) {
    wsClose();
    wsClosed = false; wsQueue = []; wsQueued = 0; wsPending = [];
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const isHost = /^[A-Za-z0-9.\-_\[\]:]+$/.test(host);
    if (!isHost) { wsClosed = true; return; }
    try { ws = new WebSocket(`${proto}//${host}:${port}/ws`); } catch (e) { wsClosed = true; return; }
    ws.binaryType = 'arraybuffer';
    const me = ws;
    ws.onopen = () => { if (ws !== me) return; for (const p of wsPending) me.send(p); wsPending = []; };
    ws.onmessage = (e) => { if (ws !== me) return; const a = new Uint8Array(e.data); wsQueue.push(a); wsQueued += a.length; };
    ws.onclose = ws.onerror = () => { if (ws === me) wsClosed = true; };
  }
  function wsClose() { const w = ws; ws = null; wsClosed = false; wsQueue = []; wsQueued = 0; wsPending = []; if (w) try { w.close(); } catch (e) {} }

  /* ---------- storage ("files") ---------- */
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const env = {
    js_now: () => performance.now() + performance.timeOrigin,
    js_clear: (c) => { if (clipped) { ctx.restore(); clipped = false; } ctx.fillStyle = css(c); ctx.fillRect(0, 0, 1280, 720); },
    js_rect: (x, y, w, h, c) => {
      const x0 = Math.round(x), y0 = Math.round(y), x1 = Math.round(x + w), y1 = Math.round(y + h);
      if (x1 <= x0 || y1 <= y0) return;
      ctx.fillStyle = css(c); ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    },
    js_circle: (cx, cy, r, c) => { ctx.fillStyle = css(c); ctx.beginPath(); ctx.arc(cx, cy, Math.max(r, 0.5), 0, 6.2831853); ctx.fill(); },
    js_line: (x0, y0, x1, y1, t, c) => {
      ctx.strokeStyle = css(c); ctx.lineWidth = t; ctx.lineCap = 'square';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    },
    js_clip: (x, y, w, h) => {
      if (clipped) ctx.restore();
      ctx.save(); clipped = true;
      ctx.beginPath(); ctx.rect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); ctx.clip();
    },
    js_clip_reset: () => { if (clipped) { ctx.restore(); clipped = false; } },
    js_pad_count: () => Math.max(1, pads.length),
    js_pad_buttons: (i) => {
      let h = i < pads.length ? padBits[i] : 0;
      if (i === 0) { h |= keyboardBits() | touchBitsMask(); if (pointerDown) h |= KEY.TOUCH; }
      return h;
    },
    js_pad_axis: (i, a) => (i < pads.length ? padAx[i][a] : 0),
    js_prompt: (hint, initial, out, max) => {
      keys.clear();
      const r = window.prompt(cstr(hint), cstr(initial));
      keys.clear();
      if (r === null) return -1;
      return putBytes(out, enc.encode(r), max);
    },
    js_ws_open: (h, p) => wsOpen(cstr(h), cstr(p)),
    js_ws_close: () => wsClose(),
    js_ws_send: (p, n) => {
      if (!ws) return -1;
      if (wsClosed || ws.readyState > 1) return -1;
      const data = u8().slice(p, p + n);
      if (ws.readyState === 0) { if (wsPending.length > 256) return -1; wsPending.push(data); } else ws.send(data);
      return n;
    },
    js_ws_recv: (p, max) => {
      if (wsQueued === 0) return (wsClosed || !ws) ? -1 : 0;
      let n = 0;
      while (wsQueue.length && n < max) {
        const a = wsQueue[0], take = Math.min(a.length, max - n);
        u8().set(a.subarray(0, take), p + n); n += take;
        if (take === a.length) wsQueue.shift(); else wsQueue[0] = a.subarray(take);
      }
      wsQueued -= n;
      return n;
    },
    js_default_server: (out, max) => {
      const port = location.port || (location.protocol === 'https:' ? '443' : '80');
      const host = /^https?:$/.test(location.protocol) ? `${location.hostname}:${port}` : '';
      return putBytes(out, enc.encode(host + '\0'), max);
    },
    js_store_get: (key, buf, max) => {
      const v = lsGet(cstr(key));
      if (v === null) return -1;
      const n = Math.min(v.length, max), m = u8();
      for (let i = 0; i < n; i++) m[buf + i] = v.charCodeAt(i) & 255;
      return n;
    },
    js_store_set: (key, data, len) => {
      const m = u8(); let s = '';
      for (let i = 0; i < len; i++) s += String.fromCharCode(m[data + i]);
      lsSet(cstr(key), s);
    },
  };

  /* ---------- touch buttons ---------- */
  const touchEl = document.getElementById('touch');
  function showTouch() { touchEl.classList.add('on'); }
  if (matchMedia('(pointer:coarse)').matches) showTouch();
  addEventListener('touchstart', showTouch, { once: true, passive: true });
  const active = new Map();
  touchEl.querySelectorAll('.tb').forEach((el) => {
    const k = el.dataset.k;
    const set = (v) => { touchBits[k] = v; el.classList.toggle('on', !!v); };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); set(1); });
    const up = (e) => { set(0); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  });
  canvas.addEventListener('pointerdown', () => { pointerDown = true; canvas.focus(); });
  addEventListener('pointerup', () => { pointerDown = false; });

  /* ---------- fullscreen ---------- */
  const fsBtn = document.getElementById('fs');
  const toggleFs = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  };
  fsBtn.addEventListener('click', () => { toggleFs(); canvas.focus(); });
  document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen'; });

  /* ---------- start ---------- */
  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < 14) return;          /* ~60 fps even on 120 Hz screens */
    last = t;
    readPads();
    wasm.bf_frame();
    latched.clear();
  }
  window.__blockfall = { env, get exports() { return wasm; } };   /* for automated tests */

  async function boot() {
    try {
      const bin = atob(window.BLOCKFALL_WASM_B64); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const { instance } = await WebAssembly.instantiate(bytes, { env });
      wasm = instance.exports; mem = wasm.memory;
      go.disabled = false; go.textContent = 'Play';
      go.focus();
    } catch (e) {
      errEl.textContent = 'Could not load the game: ' + e.message;
      go.textContent = 'Error';
    }
  }
  go.addEventListener('click', () => {
    if (!wasm.bf_init()) { errEl.textContent = 'The game failed to start.'; return; }
    splash.style.display = 'none';
    canvas.focus();
    requestAnimationFrame(loop);
  });
  boot();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
